name: Generate YouTube Short

on:
  workflow_dispatch:
    inputs:
      language:
        description: "Language for the Short"
        required: true
        type: choice
        options:
          - KZ
          - RU
          - EN
        default: KZ
      duration:
        description: "Target video duration in seconds"
        required: true
        type: choice
        options:
          - "15"
          - "30"
          - "45"
          - "60"
        default: "15"

permissions:
  contents: read

concurrency:
  group: generate-youtube-short
  cancel-in-progress: false

jobs:
  generate:
    name: Generate and validate Short
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate secrets and trend report
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${GROQ_API_KEY:-}" ]; then
            echo "::error::GROQ_API_KEY is missing in repository Actions secrets."
            exit 1
          fi

          if [ ! -f scripts/find_trend_with_video.py ]; then
            echo "::error::scripts/find_trend_with_video.py was not found."
            exit 1
          fi

          mkdir -p output
          echo "Repository and required secret checks passed."
          echo "Requested language: ${{ inputs.language }}"
          echo "Requested duration: ${{ inputs.duration }} seconds"

      - name: Install FFmpeg and Python dependencies
        run: |
          set -euo pipefail

          echo "Updating apt package indexes (maximum 6 minutes)..."
          timeout 6m sudo apt-get \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            -o Acquire::Retries=2 \
            update

          echo "Installing FFmpeg and Python system packages (maximum 8 minutes)..."
          timeout 8m sudo apt-get install -y \
            --no-install-recommends \
            ffmpeg \
            python3-pip \
            python3-venv \
            python3-pil \
            ca-certificates

          echo "Creating virtual environment..."
          python3 -m venv .venv

          echo "Upgrading pip (maximum 3 minutes)..."
          timeout 3m .venv/bin/python -m pip \
            install --disable-pip-version-check --upgrade pip

          echo "Installing Piper TTS (maximum 10 minutes)..."
          timeout 10m .venv/bin/python -m pip \
            install --disable-pip-version-check --prefer-binary piper-tts

          echo "Checking installed tools..."
          ffmpeg -version
          ffprobe -version
          .venv/bin/python -m piper --help

      - name: Find a trend with a usable topical video
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          REQUESTED_LANGUAGE: ${{ inputs.language }}
          TARGET_DURATION: ${{ inputs.duration }}
        run: |
          set -euo pipefail

          echo "Searching for a trend and a usable topical video..."
          timeout 12m .venv/bin/python \
            scripts/find_trend_with_video.py

          echo "Checking generated files..."
          find output -maxdepth 2 -type f -printf '%p (%s bytes)\n'

          if [ ! -s output/footage.mp4 ]; then
            echo "::error::The trend search did not produce output/footage.mp4."
            exit 1
          fi

      - name: Select language and voice
        env:
          REQUESTED_LANGUAGE: ${{ inputs.language }}
        run: |
          set -euo pipefail

          case "$REQUESTED_LANGUAGE" in
            KZ)
              echo "TTS_LANGUAGE=kk_KZ" >> "$GITHUB_ENV"
              ;;
            RU)
              echo "TTS_LANGUAGE=ru_RU" >> "$GITHUB_ENV"
              ;;
            EN)
              echo "TTS_LANGUAGE=en_US" >> "$GITHUB_ENV"
              ;;
            *)
              echo "::error::Unsupported language: $REQUESTED_LANGUAGE"
              exit 1
              ;;
          esac

          echo "Selected language: $REQUESTED_LANGUAGE"
          echo "TTS language code: $TTS_LANGUAGE"

      - name: Download neural voice
        run: |
          set -euo pipefail

          mkdir -p models

          case "${{ inputs.language }}" in
            KZ)
              echo "::error::A compatible Kazakh Piper voice must be configured before this step can work."
              echo "Piper does not automatically provide a model for every language."
              exit 1
              ;;
            RU)
              MODEL_URL="https://huggingface.co/rhasspy/piper-voices/resolve/main/ru/ru_RU/irina/medium/ru_RU-irina-medium.onnx"
              CONFIG_URL="https://huggingface.co/rhasspy/piper-voices/resolve/main/ru/ru_RU/irina/medium/ru_RU-irina-medium.onnx.json"
              MODEL="models/voice.onnx"
              ;;
            EN)
              MODEL_URL="https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx"
              CONFIG_URL="https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx.json"
              MODEL="models/voice.onnx"
              ;;
            *)
              echo "::error::Unsupported language."
              exit 1
              ;;
          esac

          echo "Downloading voice model..."
          curl --fail --location --retry 3 --connect-timeout 20 \
            --max-time 300 "$MODEL_URL" -o "$MODEL"

          echo "Downloading voice configuration..."
          curl --fail --location --retry 3 --connect-timeout 20 \
            --max-time 120 "$CONFIG_URL" -o "${MODEL}.json"

          test -s "$MODEL"
          test -s "${MODEL}.json"
          echo "VOICE_MODEL=$MODEL" >> "$GITHUB_ENV"

      - name: Prepare narration text and metadata
        run: |
          set -euo pipefail

          if [ ! -s output/script.txt ]; then
            echo "::error::The trend-search script must create output/script.txt."
            exit 1
          fi

          if [ ! -s output/footage.mp4 ]; then
            echo "::error::The topical video is missing."
            exit 1
          fi

          echo "Narration text:"
          cat output/script.txt

      - name: Generate neural voice
        run: |
          set -euo pipefail

          timeout 5m .venv/bin/python -m piper \
            --model "$VOICE_MODEL" \
            --config "${VOICE_MODEL}.json" \
            --input_file output/script.txt \
            --output_file output/narration.wav

          test -s output/narration.wav
          ffprobe -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            output/narration.wav

      - name: Render MP4 with topical video
        env:
          TARGET_DURATION: ${{ inputs.duration }}
        run: |
          set -euo pipefail

          if [ ! -s output/footage.mp4 ]; then
            echo "::error::Missing topical footage."
            exit 1
          fi

          if [ ! -s output/narration.wav ]; then
            echo "::error::Missing generated narration."
            exit 1
          fi

          DURATION="$TARGET_DURATION"

          timeout 8m ffmpeg -y \
            -stream_loop -1 \
            -i output/footage.mp4 \
            -i output/narration.wav \
            -t "$DURATION" \
            -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,fps=30,format=yuv420p" \
            -af "apad" \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -c:a aac \
            -b:a 128k \
            -shortest \
            -movflags +faststart \
            output/short.mp4

          test -s output/short.mp4

      - name: Validate MP4
        env:
          TARGET_DURATION: ${{ inputs.duration }}
        run: |
          set -euo pipefail

          ffprobe -v error \
            -show_entries format=duration \
            -show_entries stream=codec_type,width,height \
            -of json output/short.mp4

          DURATION="$(ffprobe -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            output/short.mp4)"

          if [ -z "$DURATION" ]; then
            echo "::error::Could not read video duration."
            exit 1
          fi

          echo "Target duration: ${TARGET_DURATION}s"
          echo "Actual duration: ${DURATION}s"

          ffmpeg -v error -i output/short.mp4 -f null -

      - name: Upload generated video, script and attribution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-short-${{ inputs.language }}-${{ github.run_number }}
          path: |
            output/
            models/
          if-no-files-found: warn
          retention-days: 7
