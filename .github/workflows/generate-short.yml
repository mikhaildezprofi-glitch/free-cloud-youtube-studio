name: Generate YouTube Short

on:
workflow_dispatch:
inputs:
title:
description: "Заголовок видео"
required: true
type: string
default: "5 интересных фактов о золоте"
script:
description: "Текст для видео"
required: true
type: string
default: "Золото — один из самых редких металлов. Оно почти не окисляется. Золото используют в электронике и медицине. Большая часть добытого золота сохраняется до сих пор. Подписывайтесь на канал!"
duration:
description: "Длительность видео"
required: true
type: choice
options:
- "15"
- "20"
- "30"
default: "20"

permissions:
contents: read

jobs:
generate:
runs-on: ubuntu-24.04
timeout-minutes: 10

steps:
  - name: Install dependencies
    run: |
      sudo apt-get update
      sudo apt-get install -y ffmpeg python3-pil fonts-dejavu-core

  - name: Generate vertical video
    env:
      VIDEO_TITLE: ${{ inputs.title }}
      VIDEO_SCRIPT: ${{ inputs.script }}
      VIDEO_DURATION: ${{ inputs.duration }}
    run: |
      mkdir -p output
      cat > /tmp/create_short.py <<'PY'
      import os, textwrap
      from PIL import Image, ImageDraw, ImageFont

      W, H = 1080, 1920
      title = os.environ["VIDEO_TITLE"].strip()[:160]
      script = os.environ["VIDEO_SCRIPT"].strip()[:1200]
      duration = int(os.environ["VIDEO_DURATION"])
      img = Image.new("RGB", (W, H), (12, 22, 45))
      draw = ImageDraw.Draw(img)

      for y in range(H):
          t = y / H
          color = (int(12 + 18*t), int(22 + 12*t), int(45 + 35*t))
          draw.line((0, y, W, y), fill=color)

      font_path = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
      regular_path = "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
      title_font = ImageFont.truetype(font_path, 68)
      body_font = ImageFont.truetype(regular_path, 43)
      footer_font = ImageFont.truetype(font_path, 32)

      def wrap_pixels(text, font, max_width):
          words = text.split()
          lines, line = [], ""
          for word in words:
              candidate = (line + " " + word).strip()
              if draw.textbbox((0, 0), candidate, font=font)[2] <= max_width:
                  line = candidate
              else:
                  if line:
                      lines.append(line)
                  line = word
          if line:
              lines.append(line)
          return lines

      draw.rounded_rectangle((55, 160, 1025, 1760), radius=42,
                             fill=(18, 34, 65), outline=(60, 120, 190), width=4)
      y = 260
      for line in wrap_pixels(title, title_font, 850)[:5]:
          draw.text((95, y), line, font=title_font, fill=(255, 211, 90))
          y += 92

      y += 65
      for paragraph in script.splitlines():
          for line in wrap_pixels(paragraph, body_font, 850):
              if y > 1480:
                  break
              draw.text((100, y), line, font=body_font, fill=(245, 247, 255))
              y += 65
          y += 20
          if y > 1480:
              break

      draw.text((100, 1630), "ПОДПИШИСЬ • НОВЫЕ ВИДЕО", font=footer_font,
                fill=(90, 205, 255))
      img.save("output/short.png")

      os.system(
          f'ffmpeg -y -loop 1 -i output/short.png '
          f'-t {duration} -r 30 -vf "scale=1080:1920,format=yuv420p" '
          f'-c:v libx264 -preset veryfast -crf 23 '
          f'-movflags +faststart output/short.mp4'
      )
      PY
      python3 /tmp/create_short.py
      ffprobe -v error -select_streams v:0 \
        -show_entries stream=width,height,codec_name \
        -show_entries format=duration \
        -of default=noprint_wrappers=1 output/short.mp4

  - name: Upload generated video
    uses: actions/upload-artifact@v4
    with:
      name: generated-text-short
      path: output/short.mp4
      retention-days: 7
      if-no-files-found: error
