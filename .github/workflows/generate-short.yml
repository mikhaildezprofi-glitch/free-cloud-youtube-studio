name: Generate YouTube Short

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      region:
        description: "Language and trend region"
        required: true
        default: "KZ"
        type: choice
        options:
          - KZ
          - RU
          - US
          - GB
      duration:
        description: "Video duration"
        required: true
        default: "30"
        type: choice
        options:
          - "15"
          - "20"
          - "30"

permissions:
  contents: read

concurrency:
  group: generate-youtube-short
  cancel-in-progress: false

jobs:
  generate:
    name: Generate AI script and topical video
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    env:
      TARGET_REGION: ${{ inputs.region || 'KZ' }}
      VIDEO_DURATION: ${{ inputs.duration || '30' }}
      GROQ_MODEL: openai/gpt-oss-20b

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate secrets and trend report
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$GROQ_API_KEY" ]; then
            echo "Missing GROQ_API_KEY Actions secret."
            exit 1
          fi

          test -s data/trends/latest.json
          python3 -m json.tool data/trends/latest.json >/dev/null

          echo "Region: $TARGET_REGION"
          echo "Duration: $VIDEO_DURATION"

      - name: Install FFmpeg and Python dependencies
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            python3-pip \
            python3-venv \
            python3-pil

          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install piper-tts

          ffmpeg -version
          ffprobe -version
          .venv/bin/python -m piper --help

      - name: Find a trend with a usable topical video
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TARGET_REGION: ${{ env.TARGET_REGION }}
          VIDEO_DURATION: ${{ env.VIDEO_DURATION }}
          GROQ_MODEL: ${{ env.GROQ_MODEL }}
        run: |
          set -euo pipefail

          python3 scripts/find_trend_with_video.py

          test -s data/scripts/latest.json
          test -s output/footage.mp4
          test -s output/attribution.txt

          python3 -m json.tool data/scripts/latest.json >/dev/null

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          d = json.loads(
              Path("data/scripts/latest.json").read_text(encoding="utf-8")
          )

          expected = {
              "KZ": "Russian",
              "RU": "Russian",
              "US": "English",
              "GB": "English",
          }

          region = os.environ["TARGET_REGION"]

          if d.get("region") != region:
              raise SystemExit(
                  "Script region does not match requested region."
              )

          if d.get("language") != expected[region]:
              raise SystemExit(
                  "Script language does not match region."
              )

          for key in (
              "topic",
              "title",
              "hook",
              "narration",
              "fact_check_note",
          ):
              if not isinstance(d.get(key), str) or not d[key].strip():
                  raise SystemExit(f"Missing script field: {key}")

          print("Selected topic:", d["topic"])
          print("Title:", d["title"])
          print("Language:", d["language"])
          PY

      - name: Select language and voice
        id: voice
        run: |
          set -euo pipefail

          case "$TARGET_REGION" in
            KZ|RU)
              echo "model=ru_RU-irina-medium" >> "$GITHUB_OUTPUT"
              ;;
            US)
              echo "model=en_US-lessac-medium" >> "$GITHUB_OUTPUT"
              ;;
            GB)
              echo "model=en_GB-alan-medium" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported region: $TARGET_REGION"
              exit 1
              ;;
          esac

      - name: Download neural voice
        env:
          VOICE_MODEL: ${{ steps.voice.outputs.model }}
        run: |
          set -euo pipefail

          .venv/bin/python -m piper.download_voices "$VOICE_MODEL"

          test -s "$VOICE_MODEL.onnx"
          test -s "$VOICE_MODEL.onnx.json"

      - name: Prepare narration text and metadata
        run: |
          set -euo pipefail
          mkdir -p output

          python3 - <<'PY'
          import json
          from pathlib import Path

          d = json.loads(
              Path("data/scripts/latest.json").read_text(encoding="utf-8")
          )

          narration = " ".join(d["narration"].split())

          if not narration:
              raise SystemExit("Narration is empty.")

          Path("output/narration.txt").write_text(
              narration + "\n",
              encoding="utf-8",
          )

          metadata = {
              "region": d["region"],
              "language": d["language"],
              "title": d["title"],
              "description": (
                  d["hook"] + "\n\n"
                  + d["fact_check_note"] + "\n\n#Shorts"
              ),
              "topic": d["topic"],
              "source_url": d["source_url"],
              "fact_check_note": d["fact_check_note"],
              "generated_at": d["generated_at"],
              "privacy_status": "private",
          }

          Path("output/metadata.json").write_text(
              json.dumps(metadata, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Generate neural voice
        env:
          VOICE_MODEL: ${{ steps.voice.outputs.model }}
        run: |
          set -euo pipefail

          .venv/bin/python -m piper \
            -m "$VOICE_MODEL" \
            -f output/voice.wav \
            < output/narration.txt

          test -s output/voice.wav

      - name: Render MP4 with topical video
        run: |
          set -euo pipefail

          case "$VIDEO_DURATION" in
            15|20|30) ;;
            *)
              echo "Unsupported duration."
              exit 1
              ;;
          esac

          test -s output/footage.mp4
          test -s output/voice.wav

          ffmpeg \
            -hide_banner \
            -loglevel error \
            -y \
            -stream_loop -1 \
            -i output/footage.mp4 \
            -i output/voice.wav \
            -t "$VIDEO_DURATION" \
            -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,fps=30,format=yuv420p" \
            -af "apad" \
            -c:v libx264 \
            -preset ultrafast \
            -crf 23 \
            -c:a aac \
            -b:a 128k \
            -ar 44100 \
            -ac 2 \
            -movflags +faststart \
            output/short.mp4

          test -s output/short.mp4

      - name: Validate MP4
        run: |
          set -euo pipefail

          python3 scripts/validate_video.py \
            --file output/short.mp4 \
            --expected-duration "$VIDEO_DURATION"

          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -show_entries stream=codec_name,width,height \
            -of default=noprint_wrappers=1 \
            output/short.mp4

      - name: Upload generated video, script and attribution
        uses: actions/upload-artifact@v6
        with:
          name: generated-short-${{ env.TARGET_REGION }}
          path: |
            output/short.mp4
            output/footage.mp4
            output/attribution.txt
            output/voice.wav
            output/narration.txt
            output/metadata.json
            data/scripts/latest.json
          retention-days: 7
          if-no-files-found: error
