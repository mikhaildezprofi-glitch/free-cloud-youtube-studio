name: Generate YouTube Short

on:
  schedule:
    # Каждый день в 11:00 по времени Казахстана (UTC+5)
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      script:
        description: "Сценарий озвучки; пустое поле = факт дня"
        required: false
        default: ""
        type: string
      duration:
        description: "Длительность видео в секундах"
        required: true
        default: "15"
        type: choice
        options:
          - "15"
          - "20"
          - "30"
      voice:
        description: "Голос русской озвучки"
        required: true
        default: "ru_RU-irina-medium"
        type: choice
        options:
          - "ru_RU-irina-medium"
          - "ru_RU-denis-medium"
          - "ru_RU-dmitri-medium"
          - "ru_RU-ruslan-medium"

permissions:
  contents: read

jobs:
  generate:
    name: Create vertical video
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies
        timeout-minutes: 8
        run: |
          set -e

          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i \
              's|azure.archive.ubuntu.com|archive.ubuntu.com|g' \
              /etc/apt/sources.list.d/ubuntu.sources
          fi

          sudo apt-get \
            -o Acquire::Retries=1 \
            -o Acquire::http::Timeout=15 \
            -o Acquire::https::Timeout=15 \
            update

          sudo apt-get \
            -o Acquire::Retries=1 \
            -o Acquire::http::Timeout=15 \
            -o Acquire::https::Timeout=15 \
            install -y --no-install-recommends \
            ffmpeg \
            python3-pil \
            python3-venv

          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install piper-tts

          ffmpeg -version
          .venv/bin/python -m piper --help

      - name: Download neural Russian voice
        timeout-minutes: 5
        env:
          PIPER_VOICE_MODEL: ${{ inputs.voice || 'ru_RU-irina-medium' }}
        run: |
          set -e

          case "$PIPER_VOICE_MODEL" in
            ru_RU-irina-medium|ru_RU-denis-medium|ru_RU-dmitri-medium|ru_RU-ruslan-medium)
              ;;
            *)
              echo "Unsupported voice: $PIPER_VOICE_MODEL"
              exit 1
              ;;
          esac

          .venv/bin/python -m piper.download_voices \
            "$PIPER_VOICE_MODEL"

          test -s "$PIPER_VOICE_MODEL.onnx"
          test -s "$PIPER_VOICE_MODEL.onnx.json"

      - name: Choose script for scheduled generation
        env:
          SCRIPT_INPUT: ${{ inputs.script }}
        run: |
          set -e

          .venv/bin/python - <<'PYTHON'
          import os
          from datetime import datetime, timezone

          supplied = os.environ.get("SCRIPT_INPUT", "").strip()

          scripts = [
              "У осьминога три сердца, а кровь голубого цвета. Два сердца прокачивают кровь через жабры, а третье снабжает кровью остальные органы.",
              "На Венере сутки длиннее года. Планета вращается вокруг своей оси медленнее, чем совершает оборот вокруг Солнца.",
              "У акул скелет состоит преимущественно из хряща, а не из костей. Это делает его более гибким.",
              "Запах после дождя называют петрикором. Он связан с ароматическими веществами из почвы, которые дождь поднимает в воздух.",
              "Пчёлы используют особый танец, чтобы сообщать сородичам направление и расстояние до источника пищи.",
              "Бананы с ботанической точки зрения относятся к ягодам. Название плода зависит от того, как он развивается из цветка.",
              "У осьминогов голубоватая кровь благодаря содержащему медь белку гемоцианину, который переносит кислород."
          ]

          day = datetime.now(timezone.utc).timetuple().tm_yday
          index = (day - 1) % len(scripts)
          script = supplied or scripts[index]

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write("VIDEO_SCRIPT=" + script.replace("\n", " ").strip() + "\n")

          if supplied:
              print("Using manually supplied script.")
          else:
              print(f"Selected daily fact #{index + 1}.")
          PYTHON

      - name: Prepare output directory
        run: |
          set -e
          mkdir -p output
          rm -f output/short.png output/short.mp4 output/voice.wav

      - name: Create vertical background without text
        run: |
          set -e

          python3 - <<'PYTHON'
          from PIL import Image, ImageDraw

          WIDTH, HEIGHT = 1080, 1920
          image = Image.new("RGB", (WIDTH, HEIGHT))
          draw = ImageDraw.Draw(image)

          top = (8, 15, 35)
          bottom = (65, 20, 90)

          for y in range(HEIGHT):
              ratio = y / (HEIGHT - 1)
              color = tuple(
                  int(top[i] * (1 - ratio) + bottom[i] * ratio)
                  for i in range(3)
              )
              draw.line((0, y, WIDTH, y), fill=color)

          draw.ellipse((650, 180, 1280, 810), fill=(28, 48, 105))
          draw.ellipse((-260, 1080, 480, 1820), fill=(76, 24, 100))
          draw.ellipse((330, 650, 820, 1140), fill=(25, 35, 78))

          image.save("output/short.png")
          print("Created background without text.")
          PYTHON

      - name: Generate Russian neural voice
        env:
          VIDEO_SCRIPT: ${{ env.VIDEO_SCRIPT }}
          PIPER_VOICE_MODEL: ${{ inputs.voice || 'ru_RU-irina-medium' }}
        run: |
          set -e

          if [ -z "$VIDEO_SCRIPT" ]; then
            echo "Voiceover script is empty."
            exit 1
          fi

          .venv/bin/python -m piper \
            -m "$PIPER_VOICE_MODEL" \
            -f output/voice.wav \
            -- "$VIDEO_SCRIPT"

          test -s output/voice.wav

      - name: Render MP4 video
        env:
          VIDEO_DURATION: ${{ inputs.duration || '15' }}
        run: |
          set -e

          DURATION="${VIDEO_DURATION:-15}"

          case "$DURATION" in
            15|20|30) ;;
            *)
              echo "Unsupported duration: $DURATION"
              exit 1
              ;;
          esac

          ffmpeg \
            -hide_banner \
            -loglevel error \
            -y \
            -loop 1 \
            -framerate 30 \
            -i output/short.png \
            -i output/voice.wav \
            -t "$DURATION" \
            -vf "scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2,format=yuv420p" \
            -af "apad" \
            -c:v libx264 \
            -preset ultrafast \
            -crf 23 \
            -c:a aac \
            -b:a 128k \
            -ar 44100 \
            -ac 2 \
            -movflags +faststart \
            output/short.mp4

      - name: Verify generated files
        run: |
          set -e

          test -s output/short.png
          test -s output/voice.wav
          test -s output/short.mp4

          ffprobe \
            -v error \
            -show_entries format=duration,size,format_name \
            -show_entries stream=codec_name,width,height,r_frame_rate \
            -of default=noprint_wrappers=1 \
            output/short.mp4

          ls -lh output/

      - name: Run strict MP4 quality gate
        env:
          VIDEO_DURATION: ${{ inputs.duration || '15' }}
        run: |
          set -e
          python3 scripts/validate_video.py \
            --file output/short.mp4 \
            --expected-duration "${VIDEO_DURATION:-15}"

      - name: Upload generated video
        uses: actions/upload-artifact@v6
        with:
          name: generated-text-free-short
          path: |
            output/short.mp4
            output/short.png
            output/voice.wav
          retention-days: 7
          if-no-files-found: error
