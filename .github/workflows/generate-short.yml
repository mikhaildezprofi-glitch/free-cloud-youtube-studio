name: Generate YouTube Short

on:
  workflow_dispatch:
    inputs:
      language:
        description: "Язык и регион видео"
        required: true
        type: choice
        options:
          - KZ
          - RU
          - US
        default: KZ

      duration:
        description: "Целевая длительность сценария в секундах"
        required: true
        type: choice
        options:
          - "15"
          - "30"
          - "45"
          - "60"
        default: "30"

permissions:
  contents: read

concurrency:
  group: generate-youtube-short
  cancel-in-progress: false

jobs:
  generate:
    name: Generate and validate Short
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate secrets and project files
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${GROQ_API_KEY:-}" ]; then
            echo "::error::Missing GROQ_API_KEY secret."
            exit 1
          fi

          test -f scripts/find_trend_with_video.py
          test -f scripts/generate_ai_script.py
          test -f scripts/ai_director.py
          test -f data/trends/latest.json

          mkdir -p output models data/scripts

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-python312-piper-v2
          restore-keys: |
            pip-${{ runner.os }}-python312-

      - name: Install FFmpeg and Python dependencies
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y ffmpeg

          command -v ffmpeg
          command -v ffprobe

          python -m venv .venv

          .venv/bin/python -m pip install --upgrade pip
          timeout 10m .venv/bin/python -m pip install --prefer-binary piper-tts

          .venv/bin/python -m piper --help >/dev/null

      - name: Cache Piper voice models
        uses: actions/cache@v4
        with:
          path: models
          key: piper-voice-${{ runner.os }}-${{ inputs.language }}-v2

      - name: Find trend, generate script and select initial footage
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-20b
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TARGET_REGION: ${{ inputs.language }}
          VIDEO_DURATION: ${{ inputs.duration }}
        run: |
          set -euo pipefail

          timeout 15m .venv/bin/python scripts/find_trend_with_video.py

          test -s output/footage.mp4
          test -s data/scripts/latest.json

          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path("data/scripts/latest.json").read_text(encoding="utf-8")
          )

          narration = str(data.get("narration", "")).strip()

          if not narration:
              raise SystemExit("ERROR: narration is missing")

          Path("output/script.txt").write_text(
              narration + "\n",
              encoding="utf-8"
          )

          Path("output/metadata.json").write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )

          print("Topic:", data.get("topic"))
          print("Title:", data.get("title"))
          print("Words:", data.get("word_count"))
          print("Language:", data.get("language"))
          PY

      - name: Select voice model
        id: voice
        env:
          REQUESTED_LANGUAGE: ${{ inputs.language }}
        run: |
          set -euo pipefail

          case "$REQUESTED_LANGUAGE" in
            KZ|RU)
              echo "model=models/ru_RU-irina-medium.onnx" >> "$GITHUB_OUTPUT"
              echo "url=https://huggingface.co/rhasspy/piper-voices/resolve/main/ru/ru_RU/irina/medium/ru_RU-irina-medium.onnx" >> "$GITHUB_OUTPUT"
              echo "config_url=https://huggingface.co/rhasspy/piper-voices/resolve/main/ru/ru_RU/irina/medium/ru_RU-irina-medium.onnx.json" >> "$GITHUB_OUTPUT"
              ;;
            US)
              echo "model=models/en_US-lessac-medium.onnx" >> "$GITHUB_OUTPUT"
              echo "url=https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx" >> "$GITHUB_OUTPUT"
              echo "config_url=https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx.json" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unsupported language: $REQUESTED_LANGUAGE"
              exit 1
              ;;
          esac

      - name: Download voice model if not cached
        env:
          VOICE_MODEL: ${{ steps.voice.outputs.model }}
          VOICE_URL: ${{ steps.voice.outputs.url }}
          CONFIG_URL: ${{ steps.voice.outputs.config_url }}
        run: |
          set -euo pipefail

          if [ ! -s "$VOICE_MODEL" ] || [ ! -s "${VOICE_MODEL}.json" ]; then
            mkdir -p models

            curl --fail --location --retry 3 --connect-timeout 20 \
              --max-time 300 "$VOICE_URL" -o "$VOICE_MODEL"

            curl --fail --location --retry 3 --connect-timeout 20 \
              --max-time 120 "$CONFIG_URL" -o "${VOICE_MODEL}.json"
          else
            echo "Using cached voice model."
          fi

          test -s "$VOICE_MODEL"
          test -s "${VOICE_MODEL}.json"

          echo "VOICE_MODEL=$VOICE_MODEL" >> "$GITHUB_ENV"

      - name: Generate neural narration
        run: |
          set -euo pipefail

          timeout 5m .venv/bin/python -m piper \
            --model "$VOICE_MODEL" \
            --config "${VOICE_MODEL}.json" \
            --input_file output/script.txt \
            --output_file output/narration.wav

          test -s output/narration.wav

          AUDIO_DURATION="$(ffprobe -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            output/narration.wav)"

          echo "Narration duration: ${AUDIO_DURATION} seconds"

      - name: AI Director - plan and assemble scenes
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-20b
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          set -euo pipefail

          test -s output/narration.wav
          test -s output/footage.mp4
          test -s data/scripts/latest.json

          timeout 15m .venv/bin/python scripts/ai_director.py

          test -s output/footage.mp4
          test -s output/director_plan.json

      - name: Render MP4 synchronized to narration
        run: |
          set -euo pipefail

          test -s output/footage.mp4
          test -s output/narration.wav

          AUDIO_DURATION="$(ffprobe -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            output/narration.wav)"

          echo "Audio duration: ${AUDIO_DURATION} seconds"

          timeout 8m ffmpeg -hide_banner -y \
            -i output/footage.mp4 \
            -i output/narration.wav \
            -map 0:v:0 \
            -map 1:a:0 \
            -t "$AUDIO_DURATION" \
            -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,fps=30,setsar=1,format=yuv420p" \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -c:a aac \
            -b:a 128k \
            -movflags +faststart \
            output/short.mp4

          test -s output/short.mp4

          VIDEO_DURATION="$(ffprobe -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            output/short.mp4)"

          echo "Video duration: ${VIDEO_DURATION} seconds"

          .venv/bin/python - "$AUDIO_DURATION" "$VIDEO_DURATION" <<'PY'
          import sys

          audio = float(sys.argv[1])
          video = float(sys.argv[2])
          difference = abs(audio - video)

          print(f"Audio: {audio:.3f}s")
          print(f"Video: {video:.3f}s")
          print(f"Difference: {difference:.3f}s")

          if difference > 0.5:
              raise SystemExit(
                  "ERROR: video duration differs from narration by more than 0.5 seconds"
              )
          PY

      - name: Validate final MP4
        run: |
          set -euo pipefail

          ffprobe -v error \
            -show_entries format=duration:stream=codec_type,width,height \
            -of json output/short.mp4

          ffmpeg -v error -i output/short.mp4 -f null -

          test -s output/director_plan.json
          test -s output/attribution.txt

      - name: Upload generated video, script, director plan and attribution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-short-${{ inputs.language }}-${{ github.run_number }}
          path: |
            output/
            data/scripts/latest.json
          if-no-files-found: warn
          retention-days: 7
