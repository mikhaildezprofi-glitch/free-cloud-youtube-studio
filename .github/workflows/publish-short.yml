name: Publish YouTube Short

on:
  workflow_run:
    workflows: ["Generate YouTube Short"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  publish:
    name: Upload generated Short privately
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check upload settings
        id: gate
        env:
          ENABLE_UPLOAD: ${{ vars.ENABLE_YOUTUBE_UPLOAD }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          if [ "$ENABLE_UPLOAD" != "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Upload skipped. Enable it explicitly with repository variable ENABLE_YOUTUBE_UPLOAD=true."
          elif [ -z "$YOUTUBE_CLIENT_ID" ] || \
               [ -z "$YOUTUBE_CLIENT_SECRET" ] || \
               [ -z "$YOUTUBE_REFRESH_TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Upload skipped. YouTube OAuth secrets are not fully configured."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Upload settings are present."
          fi

      - name: Download generated video
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: generated-text-free-short
          path: artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Install YouTube API libraries
        if: steps.gate.outputs.enabled == 'true'
        run: |
          python -m pip install --upgrade \
            google-api-python-client \
            google-auth \
            google-auth-httplib2

      - name: Upload video as private
        if: steps.gate.outputs.enabled == 'true'
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          from google.auth.transport.requests import Request
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          video_path = Path("artifact/short.mp4")
          if not video_path.is_file() or video_path.stat().st_size == 0:
              raise SystemExit("Upload failed: artifact/short.mp4 is missing or empty.")

          credentials = Credentials(
              token=None,
              refresh_token=os.environ["YOUTUBE_REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["YOUTUBE_CLIENT_ID"],
              client_secret=os.environ["YOUTUBE_CLIENT_SECRET"],
              scopes=["https://www.googleapis.com/auth/youtube.upload"],
          )
          credentials.refresh(Request())

          youtube = build(
              "youtube",
              "v3",
              credentials=credentials,
              cache_discovery=False,
          )

          from datetime import datetime, timezone
          timestamp = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")

          request = youtube.videos().insert(
              part="snippet,status",
              body={
                  "snippet": {
                      "title": f"Тестовый Shorts — {timestamp} #Shorts",
                      "description": (
                          "Короткое видео на русском языке.\n"
                          "#Shorts"
                      ),
                      "tags": ["Shorts", "русский язык"],
                      "categoryId": "22",
                      "defaultLanguage": "ru",
                  },
                  "status": {
                      "privacyStatus": "private",
                  },
              },
              media_body=MediaFileUpload(
                  str(video_path),
                  mimetype="video/mp4",
                  resumable=True,
              ),
          )

          response = request.execute()
          video_id = response["id"]

          print("Upload successful.")
          print("Privacy status: private")
          print(f"Video URL: https://youtu.be/{video_id}")
          PY

      - name: Report skipped upload
        if: steps.gate.outputs.enabled != 'true'
        run: |
          echo "No video was uploaded."
          echo "Generation remains independent and unchanged."
