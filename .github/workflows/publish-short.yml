name: Publish YouTube Short

on:
  workflow_run:
    workflows: ["Generate YouTube Short"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  publish:
    name: Upload generated Short privately
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check upload settings
        id: gate
        env:
          ENABLE_UPLOAD: ${{ vars.ENABLE_YOUTUBE_UPLOAD }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail

          if [ "$ENABLE_UPLOAD" != "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Upload disabled. No video will be published."
          elif [ -z "$YOUTUBE_CLIENT_ID" ] ||
               [ -z "$YOUTUBE_CLIENT_SECRET" ] ||
               [ -z "$YOUTUBE_REFRESH_TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "YouTube OAuth secrets are missing."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Upload settings are present."
          fi

      - name: Download generated video
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: youtube-short-*
          merge-multiple: true
          path: artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Install YouTube API libraries
        if: steps.gate.outputs.enabled == 'true'
        run: |
          python -m pip install \
            google-api-python-client \
            google-auth \
            google-auth-httplib2

      - name: Upload video as private
        if: steps.gate.outputs.enabled == 'true'
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from google.auth.transport.requests import Request
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          video_path = Path("artifact/output/short.mp4")
          metadata_path = Path("artifact/output/metadata.json")

          if not video_path.is_file() or video_path.stat().st_size == 0:
              raise SystemExit("Upload failed: artifact/output/short.mp4 is missing.")

          metadata = {}
          if metadata_path.is_file():
              try:
                  metadata = json.loads(
                      metadata_path.read_text(encoding="utf-8")
                  )
              except (ValueError, OSError):
                  print("Warning: metadata could not be read; using fallback.")

          title = str(
              metadata.get("title") or "Interesting fact of the day"
          ).strip()

          narration = str(metadata.get("narration") or "").strip()
          topic = str(metadata.get("topic") or "").strip()
          language = str(metadata.get("language") or "en").lower()

          description_parts = []
          if topic:
              description_parts.append(f"Topic: {topic}")
          if narration:
              description_parts.append(narration)

          description_parts.append("#Shorts")
          description = "\n\n".join(description_parts)

          if len(title) > 100:
              title = title[:97] + "..."

          if len(description) > 5000:
              description = description[:4990] + "..."

          credentials = Credentials(
              token=None,
              refresh_token=os.environ["YOUTUBE_REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["YOUTUBE_CLIENT_ID"],
              client_secret=os.environ["YOUTUBE_CLIENT_SECRET"],
              scopes=["https://www.googleapis.com/auth/youtube.upload"],
          )

          credentials.refresh(Request())

          youtube = build(
              "youtube",
              "v3",
              credentials=credentials,
              cache_discovery=False,
          )

          default_language = "ru" if language in ("ru", "kz") else "en"

          request = youtube.videos().insert(
              part="snippet,status",
              body={
                  "snippet": {
                      "title": title,
                      "description": description,
                      "tags": ["Shorts", "facts", "education"],
                      "categoryId": "27",
                      "defaultLanguage": default_language,
                  },
                  "status": {
                      "privacyStatus": "private",
                  },
              },
              media_body=MediaFileUpload(
                  str(video_path),
                  mimetype="video/mp4",
                  resumable=True,
              ),
          )

          response = request.execute()
          video_id = response["id"]

          print("Upload successful.")
          print("Privacy status: private")
          print(f"Video URL: https://youtu.be/{video_id}")
          PY

      - name: Report skipped upload
        if: steps.gate.outputs.enabled != 'true'
        run: |
          echo "No video was uploaded."
          echo "Upload is disabled or OAuth settings are incomplete."
